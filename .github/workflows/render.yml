name: Render reels

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode file (blank = all episodes)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["episodes/**.json"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          # Static build from GitHub releases (fast on runners); Ubuntu's apt mirrors hung for hours on 2026-11-19.
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          if curl -fsSL --retry 3 --max-time 180 "$url" -o /tmp/ffmpeg.tar.xz; then
            mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
            sudo cp /tmp/ffmpeg/bin/ffmpeg /tmp/ffmpeg/bin/ffprobe /usr/local/bin/
          else
            echo "static download failed, falling back to apt"
            timeout 300 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Cache map data and fonts
        uses: actions/cache@v4
        with:
          path: cache
          key: map-cache-v1

      - run: pip install -r requirements.txt

      - name: Pick episodes
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            echo "files=${{ github.event.inputs.episode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            changed=$(git diff --name-only HEAD~1 HEAD -- 'episodes/*.json' 2>/dev/null | tr '\n' ' ')
            # first commit has no parent: render everything
            [ -z "$changed" ] && changed=$(ls episodes/*.json | tr '\n' ' ')
            echo "files=$changed" >> "$GITHUB_OUTPUT"
          else
            echo "files=$(ls episodes/*.json | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Voice + render
        run: |
          for f in ${{ steps.pick.outputs.files }}; do
            echo "::group::$f"
            # voice via edge-tts; if it fails the reel still renders silent
            python -m reels.voice "$f" || echo "::warning::voice skipped for $f"
            python -m reels.render "$f"
            echo "::endgroup::"
          done

      - continue-on-error: true # a full artifact quota must not fail the run
        uses: actions/upload-artifact@v4
        with:
          name: reels
          # Kept for 1 day only; reels are no longer committed to a "renders" branch (GitHub storage).
          retention-days: 1
          path: |
            out/*/*.mp4
            out/*/thumbnail.png
            out/*/script.md
            out/*/captions.srt
