name: Render reels

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode file (blank = all episodes)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["episodes/**.json"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        timeout-minutes: 8
        run: |
          # an Ubuntu mirror once hung this step for 20+ minutes; time-box each try and retry
          for i in 1 2 3; do
            timeout 150 sudo apt-get -o Acquire::Retries=3 update -qq && timeout 150 sudo apt-get -o Acquire::Retries=3 install -y -qq ffmpeg && break
            echo "apt attempt $i failed, retrying"; sleep 10
          done
          ffmpeg -version | head -1

      - name: Cache map data and fonts
        uses: actions/cache@v4
        with:
          path: cache
          key: map-cache-v1

      - run: pip install -r requirements.txt

      - name: Pick episodes
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            echo "files=${{ github.event.inputs.episode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            changed=$(git diff --name-only HEAD~1 HEAD -- 'episodes/*.json' 2>/dev/null | tr '\n' ' ')
            # first commit has no parent: render everything
            [ -z "$changed" ] && changed=$(ls episodes/*.json | tr '\n' ' ')
            echo "files=$changed" >> "$GITHUB_OUTPUT"
          else
            echo "files=$(ls episodes/*.json | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Voice + render
        run: |
          for f in ${{ steps.pick.outputs.files }}; do
            echo "::group::$f"
            # voice via edge-tts; if it fails the reel still renders silent
            python -m reels.voice "$f" || echo "::warning::voice skipped for $f"
            python -m reels.render "$f"
            echo "::endgroup::"
          done

      - continue-on-error: true # a full artifact quota must not fail the run
        uses: actions/upload-artifact@v4
        with:
          name: reels
          # Kept for 1 day only; reels are no longer committed to a "renders" branch (GitHub storage).
          retention-days: 1
          path: |
            out/*/*.mp4
            out/*/thumbnail.png
            out/*/script.md
            out/*/captions.srt
